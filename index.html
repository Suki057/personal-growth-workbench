<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>个人成长全景工作台</title>
<meta name="theme-color" content="#0c1230" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="成长全景台" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  :root {
    /* 小王子星球环游记 · 深蓝星空 + 玻璃星球 + 暖金玫瑰 */
    --bg-deep: #0a0f28;
    --bg-mid: #141a3e;
    --bg-purple: #221a42;
    --bg-rose: #5a2d4a;
    --glass: rgba(255,255,255,0.075);
    --glass-strong: rgba(255,255,255,0.12);
    --glass-border: rgba(255,255,255,0.16);
    --glass-border-bright: rgba(255,255,255,0.28);
    --gold: #f6d78a;
    --gold-light: #fff2c9;
    --rose: #f0a8c0;
    --rose-deep: #e089a8;
    --lavender: #c4a8e0;
    --cyan: #9ed8f0;
    --text-on-dark: #f9f4e8;
    --text-muted: rgba(249,244,232,0.62);
    --radius: 22px;
    --radius-sm: 14px;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
    --glow-gold: 0 0 20px rgba(246,215,138,0.25), 0 0 40px rgba(246,215,138,0.12);
    --glow-rose: 0 0 20px rgba(240,168,192,0.22), 0 0 40px rgba(240,168,192,0.10);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  input, select, textarea { font-size: 16px; font-family: inherit; max-zoom: 100%; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: var(--text-on-dark);
    background: var(--bg-deep);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  /* 星空背景层 */
  .starfield {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 15% 18%, rgba(200,170,230,0.12) 0%, transparent 45%),
      radial-gradient(circle at 85% 22%, rgba(246,215,138,0.10) 0%, transparent 40%),
      radial-gradient(circle at 50% 75%, rgba(240,168,192,0.10) 0%, transparent 50%),
      linear-gradient(180deg, #0a0f28 0%, #141a3e 35%, #201644 65%, #3d2648 88%, #5a2d4a 100%);
  }
  .starfield::before, .starfield::after {
    content:""; position:absolute; inset:0;
    background-image:
      radial-gradient(2px 2px at 10% 12%, rgba(255,255,255,0.95) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 25% 28%, rgba(246,215,138,0.9) 50%, transparent 51%),
      radial-gradient(2.5px 2.5px at 42% 9%, rgba(255,255,255,0.85) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 58% 35%, rgba(246,215,138,0.8) 50%, transparent 51%),
      radial-gradient(2px 2px at 72% 16%, rgba(255,255,255,0.9) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 88% 30%, rgba(246,215,138,0.8) 50%, transparent 51%),
      radial-gradient(2px 2px at 7% 55%, rgba(255,255,255,0.75) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 33% 62%, rgba(255,255,255,0.7) 50%, transparent 51%),
      radial-gradient(2px 2px at 66% 58%, rgba(246,215,138,0.75) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 91% 68%, rgba(255,255,255,0.7) 50%, transparent 51%),
      radial-gradient(2px 2px at 18% 88%, rgba(246,215,138,0.8) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 48% 92%, rgba(255,255,255,0.75) 50%, transparent 51%),
      radial-gradient(2.5px 2.5px at 78% 85%, rgba(255,255,255,0.85) 50%, transparent 51%);
    animation: twinkle 5s ease-in-out infinite alternate;
  }
  .starfield::after { opacity: 0.6; transform: scale(1.2); animation: twinkle 7s ease-in-out infinite alternate-reverse; }
  @keyframes twinkle { from { opacity:.75; } to { opacity:1; } }
  /* 星座连线 SVG */
  .constellation {
    position: fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; opacity:0.35;
  }
  /* 飘落花瓣 */
  .petals {
    position: fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .petal {
    position:absolute; width:10px; height:10px; border-radius:50% 0 50% 50%;
    background: linear-gradient(135deg, rgba(240,168,192,0.55), rgba(224,137,168,0.25));
    animation: floatDown 14s linear infinite; opacity:0;
  }
  @keyframes floatDown {
    0% { transform: translateY(-20px) rotate(0deg); opacity:0; }
    10% { opacity:0.7; }
    90% { opacity:0.7; }
    100% { transform: translateY(110vh) rotate(360deg); opacity:0; }
  }

  /* 玻璃拟态卡片 */
  .glass-card {
    position: relative;
    background: linear-gradient(135deg, var(--glass-strong), var(--glass));
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.18);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    overflow: hidden;
  }
  .glass-card::before {
    content:""; position:absolute; top:0; left:0; right:0; height:45%;
    background: linear-gradient(180deg, rgba(255,255,255,0.14), transparent); pointer-events:none;
  }
  .glass-card::after {
    content:""; position:absolute; top:10px; bottom:10px; left:0; width:3px; border-radius:2px;
    background: linear-gradient(180deg, var(--gold), var(--rose), var(--lavender), transparent);
    box-shadow: 0 0 10px rgba(246,215,138,0.4);
  }

  .app-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
    background: linear-gradient(180deg, rgba(10,15,40,0.92), rgba(10,15,40,0.55));
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(246,215,138,0.22);
  }
  .ah-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex:1; }
  .ah-back {
    display:inline-flex; align-items:center; gap:4px;
    font-size:13px; font-weight:800; color: var(--gold);
    background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12);
    border-radius:10px; padding:6px 11px; cursor:pointer; white-space:nowrap;
  }
  .ah-title {
    font-size: 17px; font-weight: 800; letter-spacing: -0.02em; color: var(--text-on-dark);
    outline: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38vw;
    text-shadow: 0 0 12px rgba(246,215,138,0.35);
    cursor: pointer; user-select: none;
  }
  .ah-title[contenteditable="true"] {
    cursor: text; user-select: text; -webkit-user-select: text;
    border-bottom: 1.5px dashed var(--gold); padding-bottom: 1px; max-width: 52vw;
  }
  .ah-confirm {
    display:none; align-items:center; font-size:13px; font-weight:800; color:#1c2350;
    background: linear-gradient(135deg, var(--gold), #f0a8c0);
    border:none; border-radius:10px; padding:6px 14px; cursor:pointer; white-space:nowrap;
    box-shadow: 0 4px 14px rgba(232,169,110,0.35);
  }
  .ah-home {
    font-size:20px; cursor:pointer; padding:6px; border-radius:10px;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12);
  }

  main {
    position: relative; z-index: 1;
    max-width: 720px; margin: 0 auto;
    padding: calc(70px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
  }

  /* 愿景横幅 · 流星金光 */
  .vision-banner {
    position: relative;
    background: linear-gradient(135deg, rgba(246,215,138,0.14), rgba(240,168,192,0.10), rgba(196,168,224,0.10));
    color: var(--text-on-dark); border-radius: var(--radius); padding: 20px 20px 18px; margin-bottom: 18px;
    border: 1px solid rgba(246,215,138,0.35); box-shadow: var(--glow-gold); overflow:hidden;
  }
  .vision-banner::before {
    content:""; position:absolute; top:-60px; right:-40px; width:220px; height:220px; border-radius:50%;
    background: radial-gradient(circle, rgba(246,215,138,0.18), transparent 65%);
  }
  .vision-banner::after {
    content:"✦"; position:absolute; bottom:10px; right:14px; font-size:40px; color:rgba(246,215,138,0.15);
  }
  .vision-banner .vb-tag { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--gold); letter-spacing:.04em; margin-bottom:8px; }
  .vision-banner .vb-root { font-size:17px; font-weight:800; color:var(--gold); text-shadow:0 0 10px rgba(246,215,138,0.45); }
  .vision-banner .vb-text { font-size: 14.5px; line-height: 1.75; font-weight: 500; position:relative; z-index:1; outline:none; white-space: pre-wrap; word-break: break-word; }
  .vision-banner .vb-text[contenteditable="true"] { border-bottom:1.5px dashed rgba(246,215,138,0.7); }
  .vision-banner .vb-confirm {
    margin-top:10px; display:none; align-items:center; gap:6px; align-self:flex-start;
    border:none; border-radius:999px; padding:7px 22px; font-size:13px; font-weight:800; color:#5a3d1f;
    background: linear-gradient(180deg,#ffe7b3,#f5c977); box-shadow: 0 6px 18px rgba(245,201,119,0.45); cursor:pointer;
  }
  .vision-banner .vb-note { margin-top:10px; font-size:12px; color: var(--text-muted); position:relative; z-index:1; }

  /* 首页 · 星图选场景 */
  .map-wrap { min-height: calc(100vh - 110px); display:flex; flex-direction:column; align-items:center; padding-top:6px; }
  .map-title {
    text-align:center; margin: 4px 0 18px;
  }
  .map-title h1 {
    font-size: 30px; font-weight: 900; color:#fff; letter-spacing:0.02em;
    text-shadow: 0 0 8px rgba(255,255,255,0.6), 0 0 24px rgba(246,215,138,0.6), 0 0 50px rgba(240,168,192,0.35);
  }
  .map-title .mt-sub { font-size:13px; color:var(--text-muted); margin-top:6px; font-weight:600; }
  .map-ring {
    position:relative; width:100%; max-width:560px; flex:1; display:flex; flex-direction:column; justify-content:center;
  }
  .map-constellation {
    position:absolute; inset:0; z-index:0; pointer-events:none;
  }
  .scene-grid {
    position:relative; z-index:1;
    display:grid; grid-template-columns:1fr 1fr; gap:18px; width:100%;
  }
  @media (max-width: 540px){
    .scene-grid { grid-template-columns:1fr; gap:18px; padding:0 8px; }
    .map-title h1 { font-size:26px; }
  }
  .scene-card {
    position:relative; cursor:pointer; user-select:none;
    padding:22px 18px 18px; text-align:center;
    transition: transform .18s, box-shadow .2s;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .scene-card:active { transform: scale(0.985); }
  .scene-card:hover { box-shadow: var(--glow-gold), var(--shadow); }
  .scene-planet {
    width:72px; height:72px; border-radius:50%; position:relative;
    display:flex; align-items:center; justify-content:center; font-size:34px;
    box-shadow: 0 0 24px rgba(255,255,255,0.18), inset 0 3px 8px rgba(255,255,255,0.35), inset 0 -4px 10px rgba(0,0,0,0.2);
  }
  .scene-planet::after {
    content:""; position:absolute; inset:-8px; border-radius:50%;
    border: 1.5px solid rgba(255,255,255,0.28); transform: rotate(-14deg) scaleX(1.22);
    box-shadow: 0 0 12px rgba(255,255,255,0.12);
  }
  .scene-planet.gold { background: radial-gradient(circle at 35% 30%, #fff4d1, #f6d78a 45%, #c79a5e); }
  .scene-planet.lavender { background: radial-gradient(circle at 35% 30%, #f0e6ff, #c4a8e0 45%, #8a6fb0); }
  .scene-planet.rose { background: radial-gradient(circle at 35% 30%, #ffe8f0, #f0a8c0 45%, #c66a88); }
  .scene-planet.cyan { background: radial-gradient(circle at 35% 30%, #e4f8ff, #9ed8f0 45%, #5fa9c4); }
  .scene-planet.earth { background: radial-gradient(circle at 35% 30%, #d8f5e8, #8ad4b4 45%, #5a9a80); }
  .scene-card .sc-title { font-size:16px; font-weight:800; color:#fff; letter-spacing:0.02em; }
  .scene-card .sc-sub { font-size:11.5px; color:var(--text-muted); font-weight:600; line-height:1.4; }

  /* 模块内容样式 */
  .li { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.08); }
  .li:last-child { border-bottom:none; }
  .li .li-text { font-size: 14px; line-height:1.55; color: var(--text-on-dark); flex:1; min-width:0; }
  .li .li-bold { font-weight: 700; }
  .dim-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  @media (max-width: 540px){ .dim-grid { grid-template-columns: 1fr; } }
  .dim-card {
    background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.10);
    border-radius: var(--radius-sm); padding:12px 13px;
  }
  .dim-card h3 { font-size: 13.5px; font-weight:800; color:var(--gold); margin-bottom:7px; display:flex; align-items:center; gap:6px; }
  .dim-card ul { list-style:none; }
  .dim-card li { font-size:12.5px; line-height:1.5; color:var(--text-on-dark); padding:3px 0 3px 12px; position:relative; }
  .dim-card li::before { content:"✦"; position:absolute; left:0; color: var(--rose); font-size:8px; top:6px; }

  /* 周期小星球卡片 */
  .cycle-grid { display:grid; grid-template-columns: 1fr 1fr; gap:11px; }
  @media (max-width: 540px){ .cycle-grid { grid-template-columns: 1fr; } }
  .cycle-card {
    position:relative; background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius-sm); padding:13px 14px; cursor:pointer;
    transition: transform .15s, box-shadow .2s, background .2s; overflow:hidden;
  }
  .cycle-card:hover { background: rgba(255,255,255,0.10); box-shadow: 0 0 20px rgba(246,215,138,0.12); }
  .cycle-card:active { transform: scale(0.985); }
  .cycle-card .cc-name { font-size:14.5px; font-weight:800; color:#fff; }
  .cycle-card .cc-mission { display:inline-block; margin-top:5px; font-size:11px; font-weight:700; color:#5a3d1f; background: linear-gradient(135deg,#ffe7b3,#f5c977); padding:2px 9px; border-radius:10px; }
  .cycle-card .cc-desc { margin-top:8px; font-size:12px; line-height:1.55; color:var(--text-muted); }
  .cycle-card .cc-go { margin-top:9px; font-size:12px; font-weight:700; color: var(--gold); }

  /* 结果目标 / 深耕 行 */
  .goal { padding:11px 0; border-bottom:1px solid rgba(255,255,255,0.08); }
  .goal:last-child { border-bottom:none; }
  .goal-main { display:flex; gap:10px; align-items:flex-start; }
  .goal-text { font-size:14px; line-height:1.55; flex:1; min-width:0; color:var(--text-on-dark); }
  .goal.done .goal-text { text-decoration: line-through; color: var(--text-muted); }
  .goal-prog { display:flex; align-items:center; gap:10px; margin:8px 0 0 30px; }
  .goal-prog input[type=range]{ flex:1; accent-color: var(--rose); height:4px; }
  .pct { font-size:12px; font-weight:700; color: var(--gold); min-width:38px; text-align:right; }
  .chk { width:22px; height:22px; flex:none; border-radius:7px; border:2px solid var(--rose); background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; transition: background .15s; margin-top:1px; }
  .chk.on { background: var(--rose); border-color:var(--rose); box-shadow:0 0 10px rgba(240,168,192,0.45); }
  .chk.on::after { content:"✓"; }
  .streak { font-size:11px; color: var(--gold); font-weight:700; white-space:nowrap; }
  .track-head { display:flex; align-items:center; justify-content:space-between; margin:6px 0 4px; }
  .track-title { font-size:13px; font-weight:800; color:var(--gold); }
  .track-sub { font-size:11px; color:var(--text-muted); }
  .bar-wrap { height:8px; border-radius:6px; background: rgba(255,255,255,0.10); overflow:hidden; margin:6px 0 2px; }
  .bar-wrap > span { display:block; height:100%; background: linear-gradient(90deg,var(--rose),var(--lavender),var(--gold)); border-radius:6px; transition: width .3s; box-shadow:0 0 12px rgba(240,168,192,0.35); }
  .bar-label { font-size:11px; color: var(--text-muted); font-weight:600; }

  /* 复盘 */
  .review-block { border-top:1px dashed rgba(255,255,255,0.12); padding-top:12px; margin-top:12px; }
  .review-block:first-child { border-top:none; padding-top:0; margin-top:0; }
  .review-block h4 { font-size:14px; font-weight:800; color:var(--gold); margin-bottom:3px; }
  .review-block .rb-desc { font-size:12px; color:var(--text-muted); line-height:1.5; margin-bottom:9px; }
  textarea.note {
    width:100%; border:1px solid rgba(255,255,255,0.12); border-radius:12px;
    padding:11px 13px; font-size:14px; color:var(--text-on-dark);
    background: rgba(255,255,255,0.06); outline:none; resize:vertical; min-height:64px;
  }
  textarea.note:focus { box-shadow: 0 0 0 2px rgba(240,168,192,0.35); border-color:rgba(240,168,192,0.35); }
  .btn { border:none; border-radius:11px; padding:10px 16px; font-size:13.5px; font-weight:700; cursor:pointer; transition: transform .12s, box-shadow .2s; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { color:#fff; background: linear-gradient(135deg,var(--rose),var(--lavender)); box-shadow: 0 6px 16px rgba(196,168,224,0.35); }
  .btn-gold { color:#5a3d1f; background: linear-gradient(180deg,#ffe7b3,#f5c977); box-shadow: 0 6px 16px rgba(245,201,119,0.35); }
  .btn-ghost { color: var(--text-on-dark); background: rgba(255,255,255,0.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); }
  .rv-list { margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .rv-item { background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.10); border-radius:10px; padding:11px 42px 11px 12px; position:relative; }
  .rv-item .rv-date { font-size:11px; color:var(--text-muted); font-weight:700; margin-bottom:3px; }
  .rv-item .rv-text { font-size:13px; line-height:1.55; color:var(--text-on-dark); white-space:pre-wrap; word-break:break-word; }
  .rv-del { position:absolute; top:7px; right:8px; border:none; background:transparent; color:var(--rose); font-size:13px; cursor:pointer; }
  .empty { font-size:12.5px; color:var(--text-muted); padding:8px 2px; }

  /* 贴纸装饰 */
  .sticker {
    position: fixed; z-index: 0; pointer-events:none; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.25));
  }
  .sticker-prince { top: 130px; right: -10px; width: 110px; opacity: 0.9; }
  .sticker-fox { bottom: 110px; left: -6px; width: 90px; opacity: 0.85; }
  .sticker-rose { top: 46%; right: 2px; width: 55px; opacity: 0.75; }
  @media (max-width: 540px){ .sticker-prince { width: 80px; top: 120px; } .sticker-fox { width: 70px; } .sticker-rose { width: 45px; } }

  /* 开屏 · 图2 封面 */
  .splash { position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:0; text-align:center;
    background: linear-gradient(180deg, #0a0f28 0%, #141a3e 28%, #221a42 55%, #4a3058 82%, #6a3b5c 100%); }
  .splash.hidden { display:none; }
  .splash-title {
    margin-top: calc(42px + env(safe-area-inset-top));
    position:relative;
  }
  .splash-title h1 {
    color:#fff; font-size:36px; font-weight:900; letter-spacing:0.06em;
    text-shadow: 0 0 12px rgba(255,255,255,0.55), 0 0 34px rgba(246,215,138,0.55), 0 0 70px rgba(240,168,192,0.35);
    cursor:pointer; user-select:none;
  }
  .splash-title h1[contenteditable="true"] {
    cursor:text; user-select:text; -webkit-user-select:text; outline:none;
    border-bottom:2px dashed var(--gold); padding-bottom:3px;
  }
  .splash-confirm { margin-top:16px; }
  .splash-title .st-swoosh {
    position:absolute; bottom:-10px; left:50%; transform:translateX(-50%);
    width:180px; height:14px;
  }
  .splash-body { width:100%; padding:0 26px; display:flex; flex-direction:column; gap:16px; margin-top:18px; margin-bottom:18px; }
  .splash-box {
    width:100%; border-radius:20px;
    background: transparent;
    position:relative; overflow:hidden;
  }
  .splash-box.top { height: clamp(240px, 42vh, 360px); display:flex; align-items:center; justify-content:center; }
  .splash-box.bottom { padding:22px 24px 24px; text-align:center; margin-top:28px; }

  .cycle-row{ position:relative; overflow:hidden; border-radius:var(--radius-sm); }

.cycle-del{ position:absolute; right:0; top:0; bottom:0; width:76px; border:none; background:linear-gradient(135deg,#c0506a,#a83f57); color:#fff; font-size:14px; font-weight:700; border-radius:0 14px 14px 0; display:flex; align-items:center; justify-content:center; }

/* ===================== 存储 ===================== */
function storeGet(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function storeSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

/* 三套打卡数据 */
function getGoals(){ return storeGet("pgw_goals", {}); }
function getHabits(){ return storeGet("pgw_habits", {}); }
function getReviews(){ return storeGet("pgw_reviews", []); }

/* —— 成长时间 · 自定义周期 / 回收站 / 事项 / 标题 —— */
function getCustomCycles(){ return storeGet("pgw_cycles_custom", []); }
function getTrash(){ return storeGet("pgw_cycle_trash", []); }
function getCycles(){
  const trashed = getTrash().filter(t=>!t.custom).map(t=>t.id);
  return CYCLES.filter(c=>!trashed.includes(c.id)).concat(getCustomCycles());
}
function getCycle(id){ return getCycles().find(c=>c.id===id); }
function getCycleMetaStore(){ return storeGet("pgw_cycle_meta", {}); }
function getCycleMeta(id){ return getCycleMetaStore()[id] || {}; }
function setCycleMeta(id, m){ const s=getCycleMetaStore(); s[id]=Object.assign({}, s[id]||{}, m); storeSet("pgw_cycle_meta", s); }
function getItemsStore(){ return storeGet("pgw_cycle_items", {}); }
function getCycleItems(id){ return getItemsStore()[id] || { results:[], deeps:[] }; }
function setCycleItems(id, obj){ const s=getItemsStore(); s[id]=obj; storeSet("pgw_cycle_items", s); }
function cleanupTrash(){
  const now=Date.now(); const t=getTrash(); const before=t.length;
  const kept=t.filter(x=> (now-(x.deletedAt||0)) < 7*86400000 );
  if(kept.length!==before) storeSet("pgw_cycle_trash", kept);
}

/* ===================== 状态 / 渲染 ===================== */
let currentView = "home-map";
let viewStack = ["home-map"];
let pageTitle = DEFAULT_TITLE;

function navigateTo(view, push=true){
  if(push) viewStack.push(view); else viewStack[viewStack.length-1] = view;
  currentView = view;
  updateHeader(); render(); window.scrollTo(0,0);
}
function goBack(){
  if(viewStack.length > 1){
    viewStack.pop();
    currentView = viewStack[viewStack.length-1];
    updateHeader(); render(); window.scrollTo(0,0);
  }
}
function goHome(){
  viewStack = ["home-map"]; currentView = "home-map";
  updateHeader(); render(); window.scrollTo(0,0);
}

function updateHeader(){
  const backBtn = document.getElementById("ahBack");
  const homeBtn = document.getElementById("ahHome");
  const titleEl = document.getElementById("appTitle");
  if(!backBtn || !homeBtn || !titleEl) return;
  if(currentView === "home-map"){
    backBtn.style.display = "none";
    homeBtn.style.display = "none";
    pageTitle = DEFAULT_TITLE;
  } else {
    backBtn.style.display = "inline-flex";
    homeBtn.style.display = "inline-flex";
    pageTitle = viewTitle(currentView);
  }
  if(titleEl.getAttribute("contenteditable") !== "true"){
    titleEl.textContent = pageTitle;
  }
}

function viewTitle(v){
  if(v === "home-map") return DEFAULT_TITLE;
  if(v === "north") return "人生北极星";
  if(v === "cycles") return "成长时间";
  if(v === "dims") return "五大成长维度";
  if(v === "habits") return "每日深耕复利";
  if(v === "reviews") return "复盘迭代体系";
  if(v === "cycle-trash") return "回收站";
  const cyc = getCycle(v);
  if(cyc) return cyc.name + (cyc.mission ? " · " + cyc.mission : "");
  return DEFAULT_TITLE;
}

function render(){
  const c = document.getElementById("container");
  if(currentView === "home-map") c.innerHTML = renderHomeMap();
  else if(currentView === "north") c.innerHTML = renderNorthPage();
  else if(currentView === "cycles") c.innerHTML = renderCyclesMenuPage();
  else if(currentView === "dims") c.innerHTML = renderDimsPage();
  else if(currentView === "habits") c.innerHTML = renderHabitsPage();
  else if(currentView === "reviews") c.innerHTML = renderReviewsPage();
  else if(currentView === "cycle-trash") c.innerHTML = renderTrashPage();
  else c.innerHTML = renderCycle(currentView);
}

  const habits = getHabits(); const today = habits[todayStr()] || {};
  const overall = items.results.length ? Math.round(items.results.reduce((a,r,i)=>a+resultPct(r, id+"-r"+i),0)/items.results.length) : 0;
  const resultsHtml = items.results.map((r,i)=>{
    const pct = resultPct(r, id+"-r"+i);
    const meta = r.mode==='manual'
      ? `<span class="gm">手动进度</span>`
      : `<span class="gm">起始 ${r.base===undefined?'—':r.base} → 目标 ${r.target===undefined?'—':r.target} · 当前 ${r.current===undefined?'—':r.current}</span><button class="gm-btn" onclick="recordResult('${id}',${i})">📊 记录进度</button>`;
    return `<div class="goal ${r.done?'done':''}" id="goal_${id}_${i}">
      <div class="goal-main">
        <button class="chk ${r.done?'on':''}" onclick="toggleResult('${id}',${i})"></button>

      </div>

        <span class="pct">${fmtPct(pct)}%</span>
      </div>
      <div class="goal-meta">${meta}</div>
      ${goalRecordsHtml(id, i, r)}
    </div>`;
  }).join("");
  const deepsHtml = items.deeps.map((d,i)=>{
    const hid = id+"-d"+i; const on = !!today[hid];

let _cyc = { id:null, x0:0, moved:false, card:null, row:null };
function cycTouchStart(e, id){
  const card = e.currentTarget; const row = card.closest(".cycle-row");
  _cyc = { id, x0:e.touches[0].clientX, moved:false, card, row };
}
function cycTouchMove(e, id){
  if(_cyc.id!==id) return;
  const dx = e.touches[0].clientX - _cyc.x0;
  if(Math.abs(dx) > 6) _cyc.moved = true;
  const tx = Math.max(-76, Math.min(0, dx));
  _cyc.card.style.transform = "translateX("+tx+"px)";
}
function cycTouchEnd(e, id){
  if(_cyc.id!==id) return;
  const dx = e.changedTouches[0].clientX - _cyc.x0;
  const open = dx < -40;
  _cyc.card.style.transform = open ? "translateX(-76px)" : "translateX(0)";
  if(open) _cyc.row.classList.add("open"); else _cyc.row.classList.remove("open");
  _cyc.moved = false;
}
function cycClick(e){
  if(_cyc.moved) return;
  const row = e.currentTarget.closest(".cycle-row");
  const id = row.getAttribute("data-id");
  if(row.classList.contains("open")){ row.classList.remove("open"); e.currentTarget.style.transform = "translateX(0)"; return; }
  navigateTo(id);
}

  storeSet("pgw_cycle_trash", trash.filter(x=>x.id!==id));

function renderTrashPage(){
  const trash = getTrash();
  let html = `<div class="menu-title"><h2>回收站</h2><p>可恢复 · 7 天后自动永久删除</p></div>`;
  if(!trash.length){ html += `<div class="empty glass-card">回收站是空的 ✨</div>`; return html; }
  html += `<div class="trash-list">` + trash.map(t=>{

    return `<div class="glass-card trash-item">
      <div class="ti-main">
        <div class="ti-name">${escapeHtml(t.name)}</div>

        <button class="btn btn-primary" onclick="restoreCycle('${t.id}')">恢复</button>
        <button class="btn btn-danger" onclick="purgeCycle('${t.id}')">永久删除</button>

  }).join("") + `</div>`;

}
let _edit = null;
function beginEdit(el, confirmId, onSave){
  el.setAttribute("contenteditable","true"); el.focus();
  const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  if(confirmId){ const b = document.getElementById(confirmId); if(b) b.style.display = "inline-flex"; }
  _edit = { el, onSave, orig: el.innerText };
}
function commitEdit(){
  if(!_edit) return;
  const v = _edit.el.innerText.trim();
  if(_edit.onSave) _edit.onSave(v);
  endEdit();
}
function cancelEdit(){
  if(!_edit) return;
  _edit.el.innerText = _edit.orig;
  endEdit();
}
function endEdit(){
  if(_edit && _edit.el){ _edit.el.setAttribute("contenteditable","false"); }

}

});

/* ===================== 结果目标 · 数值进度 ===================== */
function calcPct(r){
  const base = Number(r.base), target = Number(r.target), cur = Number(r.current);
  if([base,target,cur].some(isNaN) || base === target) return 0;
  let p = (cur - base) / (target - base) * 100;
  p = Math.max(0, Math.min(100, p));
  return Math.round(p*10)/10;
}
function fmtPct(p){ p = Math.round(p*10)/10; return (p % 1 === 0) ? String(Math.round(p)) : p.toFixed(1); }
function resultPct(r, gid){
  if(r.mode === 'manual') return Number(r.pct)||0;
  const recs = r.records || [];
  if(recs.length){ const last = recs.slice().sort((a,b)=> a.date < b.date ? -1 : 1).pop(); return Number(last.pct)||0; }
  if(r.base !== undefined && r.target !== undefined) return calcPct(r);
  const g = getGoals(); return (g[gid] && g[gid].pct) ? g[gid].pct : 0;
}
function showModal(o){
  const ov = document.createElement('div'); ov.className = 'modal-overlay';
  ov.innerHTML = `<div class='modal'><div class='modal-title'>` + (o.title||'') + `</div><div class='modal-body'>` + (o.body||'') + `</div><div class='modal-btns'><button class='btn btn-ghost' id='mCancel'>` + (o.cancelText||'取消') + `</button><button class='btn btn-primary' id='mOk'>` + (o.confirmText||'确认') + `</button></div></div>`;
  document.body.appendChild(ov);
  const close = ()=> ov.remove();
  ov.querySelector('#mCancel').onclick = close;
  ov.querySelector('#mOk').onclick = ()=>{ const r = o.onConfirm && o.onConfirm(); if(r === false) return; close(); };
  ov.onclick = (e)=>{ if(e.target === ov) close(); };
  setTimeout(()=>{ const f = ov.querySelector('input,textarea'); if(f) f.focus(); }, 50);
}

      '<label>或 本期新增量（自动累计到当前）</label><input id=\'recAdd\' type=\'number\' step=\'any\' placeholder=\'可选，如 100\'>',

function enterApp(){
  document.getElementById("splash").classList.add("hidden");
  try{ sessionStorage.setItem("pgw_splash_seen","1"); }catch(e){}
}
function initTitle(){
  const t = storeGet(APP_TITLE_KEY, DEFAULT_TITLE);
  pageTitle = t;
  const el = document.getElementById("appTitle");
  el.textContent = t;
  const sp = document.getElementById("splashTitle");
  if(sp) sp.textContent = t;
}
function startEditTitle(elId, btnId){
  const el = document.getElementById(elId);
  const btn = document.getElementById(btnId);
  if(!el) return;
  el.setAttribute("contenteditable","true");
  el.focus();
  const r = document.createRange(); r.selectNodeContents(el);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  if(btn) btn.style.display = "inline-flex";
}
function syncTitle(val){
  pageTitle = val;
  storeSet(APP_TITLE_KEY, val);
  const a = document.getElementById("appTitle");
  const s = document.getElementById("splashTitle");
  if(a){ a.textContent = val; a.setAttribute("contenteditable","false"); }
  if(s){ s.textContent = val; s.setAttribute("contenteditable","false"); }
  const c1 = document.getElementById("ahConfirm"); if(c1) c1.style.display = "none";
  const c2 = document.getElementById("splashConfirm"); if(c2) c2.style.display = "none";
}
function confirmTitle(elId){
  const el = document.getElementById(elId);
  if(!el) return;
  let val = el.textContent.trim() || DEFAULT_TITLE;
  syncTitle(val);
}
function startEditSplash(){ startEditTitle("splashTitle","splashConfirm"); }
function confirmSplash(){ confirmTitle("splashTitle"); }

/* 愿景文字 · 双击修改 */
function startEditVision(){
  const el = document.getElementById("visionText");
  const btn = document.getElementById("visionConfirm");
  if(!el) return;
  el.setAttribute("contenteditable","true");
  el.focus();
  const r = document.createRange(); r.selectNodeContents(el);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  if(btn) btn.style.display = "inline-flex";
}
function confirmVision(){
  const el = document.getElementById("visionText");
  const btn = document.getElementById("visionConfirm");
  if(!el) return;
  let val = el.innerText.trim();
  if(!val) val = VISION;
  storeSet(VISION_KEY, val);
  el.textContent = val;
  el.setAttribute("contenteditable","false");
  if(btn) btn.style.display = "none";
}
function makePetals(){
  const box = document.getElementById("petals");
  if(!box) return;
  for(let i=0;i<10;i++){
    const p = document.createElement("div"); p.className="petal";
    p.style.left = (Math.random()*100)+"%";
    p.style.animationDelay = (Math.random()*14)+"s";
    p.style.animationDuration = (12+Math.random()*8)+"s";
    p.style.width = (8+Math.random()*8)+"px"; p.style.height = p.style.width;
    box.appendChild(p);
  }
}
function init(){
  initTitle(); makePetals();
  updateHeader(); render();
  let seen = false; try{ seen = sessionStorage.getItem("pgw_splash_seen")==="1"; }catch(e){}
  if(seen) document.getElementById("splash").classList.add("hidden");
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
}
init();
</script>
