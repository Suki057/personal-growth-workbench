<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>个人成长全景工作台</title>
<meta name="theme-color" content="#0c1230" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="成长全景台" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  :root {
    /* 小王子星球环游记 · 深蓝星空 + 玻璃星球 + 暖金玫瑰 */
    --bg-deep: #0a0f28;
    --bg-mid: #141a3e;
    --bg-purple: #221a42;
    --bg-rose: #5a2d4a;
    --glass: rgba(255,255,255,0.075);
    --glass-strong: rgba(255,255,255,0.12);
    --glass-border: rgba(255,255,255,0.16);
    --glass-border-bright: rgba(255,255,255,0.28);
    --gold: #f6d78a;
    --gold-light: #fff2c9;
    --rose: #f0a8c0;
    --rose-deep: #e089a8;
    --lavender: #c4a8e0;
    --cyan: #9ed8f0;
    --text-on-dark: #f9f4e8;
    --text-muted: rgba(249,244,232,0.62);
    --radius: 22px;
    --radius-sm: 14px;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
    --glow-gold: 0 0 20px rgba(246,215,138,0.25), 0 0 40px rgba(246,215,138,0.12);
    --glow-rose: 0 0 20px rgba(240,168,192,0.22), 0 0 40px rgba(240,168,192,0.10);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  input, select, textarea { font-size: 16px; font-family: inherit; max-zoom: 100%; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: var(--text-on-dark);
    background: var(--bg-deep);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  /* 星空背景层 */
  .starfield {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 15% 18%, rgba(200,170,230,0.12) 0%, transparent 45%),
      radial-gradient(circle at 85% 22%, rgba(246,215,138,0.10) 0%, transparent 40%),
      radial-gradient(circle at 50% 75%, rgba(240,168,192,0.10) 0%, transparent 50%),
      linear-gradient(180deg, #0a0f28 0%, #141a3e 35%, #201644 65%, #3d2648 88%, #5a2d4a 100%);
  }
  .starfield::before, .starfield::after {
    content:""; position:absolute; inset:0;
    background-image:
      radial-gradient(2px 2px at 10% 12%, rgba(255,255,255,0.95) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 25% 28%, rgba(246,215,138,0.9) 50%, transparent 51%),
      radial-gradient(2.5px 2.5px at 42% 9%, rgba(255,255,255,0.85) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 58% 35%, rgba(246,215,138,0.8) 50%, transparent 51%),
      radial-gradient(2px 2px at 72% 16%, rgba(255,255,255,0.9) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 88% 30%, rgba(246,215,138,0.8) 50%, transparent 51%),
      radial-gradient(2px 2px at 7% 55%, rgba(255,255,255,0.75) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 33% 62%, rgba(255,255,255,0.7) 50%, transparent 51%),
      radial-gradient(2px 2px at 66% 58%, rgba(246,215,138,0.75) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 91% 68%, rgba(255,255,255,0.7) 50%, transparent 51%),
      radial-gradient(2px 2px at 18% 88%, rgba(246,215,138,0.8) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 48% 92%, rgba(255,255,255,0.75) 50%, transparent 51%),
      radial-gradient(2.5px 2.5px at 78% 85%, rgba(255,255,255,0.85) 50%, transparent 51%);
    animation: twinkle 5s ease-in-out infinite alternate;
  }
  .starfield::after { opacity: 0.6; transform: scale(1.2); animation: twinkle 7s ease-in-out infinite alternate-reverse; }
  @keyframes twinkle { from { opacity:.75; } to { opacity:1; } }
  /* 星座连线 SVG */
  .constellation {
    position: fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; opacity:0.35;
  }
  /* 飘落花瓣 */
  .petals {
    position: fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .petal {
    position:absolute; width:10px; height:10px; border-radius:50% 0 50% 50%;
    background: linear-gradient(135deg, rgba(240,168,192,0.55), rgba(224,137,168,0.25));
    animation: floatDown 14s linear infinite; opacity:0;
  }
  @keyframes floatDown {
    0% { transform: translateY(-20px) rotate(0deg); opacity:0; }
    10% { opacity:0.7; }
    90% { opacity:0.7; }
    100% { transform: translateY(110vh) rotate(360deg); opacity:0; }
  }

  /* 玻璃拟态卡片 */
  .glass-card {
    position: relative;
    background: linear-gradient(135deg, var(--glass-strong), var(--glass));
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.18);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    overflow: hidden;
  }
  .glass-card::before {
    content:""; position:absolute; top:0; left:0; right:0; height:45%;
    background: linear-gradient(180deg, rgba(255,255,255,0.14), transparent); pointer-events:none;
  }
  .glass-card::after {
    content:""; position:absolute; top:10px; bottom:10px; left:0; width:3px; border-radius:2px;
    background: linear-gradient(180deg, var(--gold), var(--rose), var(--lavender), transparent);
    box-shadow: 0 0 10px rgba(246,215,138,0.4);
  }

  .app-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 18px 10px;
    background: linear-gradient(180deg, rgba(10,15,40,0.92), rgba(10,15,40,0.55));
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(246,215,138,0.22);
  }
  .ah-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .ah-emoji { font-size: 20px; filter: drop-shadow(0 0 8px rgba(246,215,138,0.8)); }
  .ah-title {
    font-size: 17px; font-weight: 800; letter-spacing: -0.02em; color: var(--text-on-dark);
    outline: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62vw;
    text-shadow: 0 0 12px rgba(246,215,138,0.35);
  }
  .ah-date { font-size: 12px; color: var(--text-muted); font-weight: 600; white-space: nowrap; }

  main {
    position: relative; z-index: 1;
    max-width: 720px; margin: 0 auto;
    padding: calc(78px + env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom));
  }

  /* 愿景横幅 · 流星金光 */
  .vision-banner {
    position: relative;
    background: linear-gradient(135deg, rgba(246,215,138,0.14), rgba(240,168,192,0.10), rgba(196,168,224,0.10));
    color: var(--text-on-dark); border-radius: var(--radius); padding: 20px 20px 18px; margin-bottom: 18px;
    border: 1px solid rgba(246,215,138,0.35); box-shadow: var(--glow-gold); overflow:hidden;
  }
  .vision-banner::before {
    content:""; position:absolute; top:-60px; right:-40px; width:220px; height:220px; border-radius:50%;
    background: radial-gradient(circle, rgba(246,215,138,0.18), transparent 65%);
  }
  .vision-banner::after {
    content:"✦"; position:absolute; bottom:10px; right:14px; font-size:40px; color:rgba(246,215,138,0.15);
  }
  .vision-banner .vb-tag { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--gold); letter-spacing:.04em; margin-bottom:8px; }
  .vision-banner .vb-text { font-size: 14.5px; line-height: 1.75; font-weight: 500; position:relative; z-index:1; }
  .vision-banner .vb-note { margin-top:10px; font-size:12px; color: var(--text-muted); position:relative; z-index:1; }

  /* 首页星球地图 */
  .hero-title {
    text-align:center; margin: 8px 0 20px;
  }
  .hero-title h1 {
    font-size: 26px; font-weight: 900; color:#fff; letter-spacing:-0.02em;
    text-shadow:
      0 0 8px rgba(255,255,255,0.6),
      0 0 20px rgba(246,215,138,0.6),
      0 0 40px rgba(246,215,138,0.35),
      0 0 70px rgba(240,168,192,0.25);
  }
  .hero-title .ht-sub {
    font-size: 13px; color: var(--text-muted); margin-top:6px; font-weight:600;
  }

  .planet-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 13px;
  }
  @media (max-width: 540px){ .planet-grid { grid-template-columns: 1fr; } }
  .planet-card {
    position: relative; cursor: pointer; user-select: none;
    padding: 17px 17px 17px 22px;
    transition: transform .18s, box-shadow .2s;
  }
  .planet-card:active { transform: scale(0.985); }
  .planet-card:hover { box-shadow: var(--glow-gold), var(--shadow); }
  .planet-card .pc-top { display:flex; align-items:center; gap:11px; margin-bottom:10px; }
  .planet-icon {
    width:42px; height:42px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:22px;
    box-shadow: 0 0 16px rgba(255,255,255,0.18), inset 0 2px 4px rgba(255,255,255,0.3);
    position:relative;
  }
  .planet-icon::after {
    content:""; position:absolute; inset:-5px; border-radius:50%;
    border: 1px solid rgba(255,255,255,0.25); transform: rotate(-15deg) scaleX(1.15);
  }
  .planet-icon.gold { background: linear-gradient(135deg, #ffe9b3, #e8b85c); }
  .planet-icon.rose { background: linear-gradient(135deg, #ffd4e0, #e089a8); }
  .planet-icon.lavender { background: linear-gradient(135deg, #e8d9f7, #a884c9); }
  .planet-icon.cyan { background: linear-gradient(135deg, #d4f0ff, #7abbd4); }
  .planet-icon.earth { background: linear-gradient(135deg, #b8e6d4, #5fa88a); }
  .pc-title { font-size: 16px; font-weight: 800; color:#fff; letter-spacing:-0.01em; }
  .pc-sub { font-size: 11.5px; color: var(--text-muted); margin-top:2px; font-weight:600; }
  .pc-body { display:none; margin-top:12px; padding-top:12px; border-top:1px dashed rgba(255,255,255,0.12); }
  .planet-card.open .pc-body { display:block; }
  .planet-card .pc-chev { position:absolute; top:18px; right:16px; font-size:12px; color:var(--text-muted); transition:transform .2s; }
  .planet-card.open .pc-chev { transform: rotate(180deg); }

  /* 模块内容样式 */
  .li { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.08); }
  .li:last-child { border-bottom:none; }
  .li .li-text { font-size: 14px; line-height:1.55; color: var(--text-on-dark); flex:1; min-width:0; }
  .li .li-bold { font-weight: 700; }
  .dim-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  @media (max-width: 540px){ .dim-grid { grid-template-columns: 1fr; } }
  .dim-card {
    background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.10);
    border-radius: var(--radius-sm); padding:12px 13px;
  }
  .dim-card h3 { font-size: 13.5px; font-weight:800; color:var(--gold); margin-bottom:7px; display:flex; align-items:center; gap:6px; }
  .dim-card ul { list-style:none; }
  .dim-card li { font-size:12.5px; line-height:1.5; color:var(--text-on-dark); padding:3px 0 3px 12px; position:relative; }
  .dim-card li::before { content:"✦"; position:absolute; left:0; color: var(--rose); font-size:8px; top:6px; }

  /* 周期小星球卡片 */
  .cycle-grid { display:grid; grid-template-columns: 1fr 1fr; gap:11px; }
  @media (max-width: 540px){ .cycle-grid { grid-template-columns: 1fr; } }
  .cycle-card {
    position:relative; background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius-sm); padding:13px 14px; cursor:pointer;
    transition: transform .15s, box-shadow .2s, background .2s; overflow:hidden;
  }
  .cycle-card:hover { background: rgba(255,255,255,0.10); box-shadow: 0 0 20px rgba(246,215,138,0.12); }
  .cycle-card:active { transform: scale(0.985); }
  .cycle-card .cc-name { font-size:14.5px; font-weight:800; color:#fff; }
  .cycle-card .cc-mission { display:inline-block; margin-top:5px; font-size:11px; font-weight:700; color:#5a3d1f; background: linear-gradient(135deg,#ffe7b3,#f5c977); padding:2px 9px; border-radius:10px; }
  .cycle-card .cc-desc { margin-top:8px; font-size:12px; line-height:1.55; color:var(--text-muted); }
  .cycle-card .cc-go { margin-top:9px; font-size:12px; font-weight:700; color: var(--gold); }

  /* 结果目标 / 深耕 行 */
  .goal { padding:11px 0; border-bottom:1px solid rgba(255,255,255,0.08); }
  .goal:last-child { border-bottom:none; }
  .goal-main { display:flex; gap:10px; align-items:flex-start; }
  .goal-text { font-size:14px; line-height:1.55; flex:1; min-width:0; color:var(--text-on-dark); }
  .goal.done .goal-text { text-decoration: line-through; color: var(--text-muted); }
  .goal-prog { display:flex; align-items:center; gap:10px; margin:8px 0 0 30px; }
  .goal-prog input[type=range]{ flex:1; accent-color: var(--rose); height:4px; }
  .pct { font-size:12px; font-weight:700; color: var(--gold); min-width:38px; text-align:right; }
  .chk { width:22px; height:22px; flex:none; border-radius:7px; border:2px solid var(--rose); background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; transition: background .15s; margin-top:1px; }
  .chk.on { background: var(--rose); border-color:var(--rose); box-shadow:0 0 10px rgba(240,168,192,0.45); }
  .chk.on::after { content:"✓"; }
  .streak { font-size:11px; color: var(--gold); font-weight:700; white-space:nowrap; }
  .track-head { display:flex; align-items:center; justify-content:space-between; margin:6px 0 4px; }
  .track-title { font-size:13px; font-weight:800; color:var(--gold); }
  .track-sub { font-size:11px; color:var(--text-muted); }
  .bar-wrap { height:8px; border-radius:6px; background: rgba(255,255,255,0.10); overflow:hidden; margin:6px 0 2px; }
  .bar-wrap > span { display:block; height:100%; background: linear-gradient(90deg,var(--rose),var(--lavender),var(--gold)); border-radius:6px; transition: width .3s; box-shadow:0 0 12px rgba(240,168,192,0.35); }
  .bar-label { font-size:11px; color: var(--text-muted); font-weight:600; }

  /* 复盘 */
  .review-block { border-top:1px dashed rgba(255,255,255,0.12); padding-top:12px; margin-top:12px; }
  .review-block:first-child { border-top:none; padding-top:0; margin-top:0; }
  .review-block h4 { font-size:14px; font-weight:800; color:var(--gold); margin-bottom:3px; }
  .review-block .rb-desc { font-size:12px; color:var(--text-muted); line-height:1.5; margin-bottom:9px; }
  textarea.note {
    width:100%; border:1px solid rgba(255,255,255,0.12); border-radius:12px;
    padding:11px 13px; font-size:14px; color:var(--text-on-dark);
    background: rgba(255,255,255,0.06); outline:none; resize:vertical; min-height:64px;
  }
  textarea.note:focus { box-shadow: 0 0 0 2px rgba(240,168,192,0.35); border-color:rgba(240,168,192,0.35); }
  .btn { border:none; border-radius:11px; padding:10px 16px; font-size:13.5px; font-weight:700; cursor:pointer; transition: transform .12s, box-shadow .2s; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { color:#fff; background: linear-gradient(135deg,var(--rose),var(--lavender)); box-shadow: 0 6px 16px rgba(196,168,224,0.35); }
  .btn-gold { color:#5a3d1f; background: linear-gradient(180deg,#ffe7b3,#f5c977); box-shadow: 0 6px 16px rgba(245,201,119,0.35); }
  .btn-ghost { color: var(--text-on-dark); background: rgba(255,255,255,0.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); }
  .rv-list { margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .rv-item { background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.10); border-radius:10px; padding:9px 11px; position:relative; }
  .rv-item .rv-date { font-size:11px; color:var(--text-muted); font-weight:700; margin-bottom:3px; }
  .rv-item .rv-text { font-size:13px; line-height:1.55; color:var(--text-on-dark); white-space:pre-wrap; word-break:break-word; }
  .rv-del { position:absolute; top:7px; right:8px; border:none; background:transparent; color:var(--rose); font-size:13px; cursor:pointer; }
  .empty { font-size:12.5px; color:var(--text-muted); padding:8px 2px; }

  /* 底部导航 */
  .bottom-nav {
    position: fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; justify-content:center;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, rgba(10,15,40,0.96), rgba(10,15,40,0.78));
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-top: 1px solid rgba(246,215,138,0.22);
  }
  .bottom-nav::-webkit-scrollbar { display:none; }
  .nav-tab {
    flex:none; border:none; background:transparent; color: var(--text-muted);
    font-size:13px; font-weight:700; padding:9px 16px; border-radius:999px;
    cursor:pointer; white-space:nowrap; transition: background .15s, color .15s, box-shadow .2s;
  }
  .nav-tab.active { color:#5a3d1f; background: linear-gradient(180deg,#ffe7b3,#f5c977); box-shadow: 0 4px 14px rgba(245,201,119,0.4); }

  /* 贴纸装饰 */
  .sticker {
    position: fixed; z-index: 0; pointer-events:none; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.25));
  }
  .sticker-prince { top: 130px; right: -10px; width: 110px; opacity: 0.9; }
  .sticker-fox { bottom: 110px; left: -6px; width: 90px; opacity: 0.85; }
  .sticker-rose { top: 46%; right: 2px; width: 55px; opacity: 0.75; }
  @media (max-width: 540px){ .sticker-prince { width: 80px; top: 120px; } .sticker-fox { width: 70px; } .sticker-rose { width: 45px; } }

  /* 开屏 */
  .splash { position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px; text-align:center;
    background: linear-gradient(180deg, #0a0f28 0%, #141a3e 30%, #221a42 60%, #4a3058 88%, #6a3b5c 100%); }
  .splash.hidden { display:none; }
  .splash svg { width: 240px; height: 240px; margin-bottom: 10px; filter: drop-shadow(0 8px 24px rgba(0,0,0,0.4)); }
  .splash h1 { color:#fff; font-size:26px; font-weight:900; letter-spacing:-0.02em;
    text-shadow: 0 0 10px rgba(255,255,255,0.5), 0 0 30px rgba(246,215,138,0.5), 0 0 60px rgba(240,168,192,0.35); }
  .splash .sp-sub { color: var(--gold); font-size:14px; margin-top:8px; font-weight:700; }
  .splash .sp-quote { color: var(--text-muted); font-size:12.5px; margin-top:16px; line-height:1.7; max-width:300px; font-style:italic; }
  .splash .sp-enter { margin-top:24px; border:none; border-radius:999px; padding:14px 40px; font-size:15px; font-weight:800; color:#5a3d1f; background: linear-gradient(180deg,#ffe7b3,#f5c977); box-shadow: 0 8px 24px rgba(245,201,119,0.5); cursor:pointer; }
  .topback { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color: var(--gold); background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); border-radius:10px; padding:6px 12px; cursor:pointer; margin-bottom:12px; }

  /* 详情页面板 */
  .panel { margin-bottom: 16px; }
  .panel-h { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 18px 16px 24px; cursor:pointer; user-select:none; }
  .panel-h .ph-main { display:flex; align-items:center; gap:10px; min-width:0; }
  .panel-h h2 { font-size: 17px; font-weight: 800; color: #fff; letter-spacing: -0.01em; text-shadow:0 0 10px rgba(246,215,138,0.25); }
  .panel-h .ph-sub { font-size: 11.5px; color: var(--text-muted); font-weight: 600; }
  .chev { color: var(--text-muted); font-size: 13px; transition: transform .2s; flex: none; }
  .panel.collapsed .panel-b { display: none; }
  .panel.collapsed .chev { transform: rotate(-90deg); }
  .panel-b { position: relative; padding: 0 18px 18px 24px; }
</style>
</head>
<body>

function storeGet(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function storeSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&quot;","'":"&#39;"}[c])); }

function planetCard(id, emoji, tone, title, sub, body, collapsed){
  return `<section class="planet-card glass-card ${collapsed?'':'open'}" id="pc-${id}" onclick="togglePlanetCard(event,'${id}')">
    <div class="pc-top">
      <div class="planet-icon ${tone}">${emoji}</div>

    <div class="pc-body" onclick="event.stopPropagation()">${body}</div>
  </section>`;
}
function togglePlanetCard(e, id){
  if(e && e.target){
    const t = e.target;
    if(t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='BUTTON' || t.tagName==='A' || t.closest('.pc-body')) return;
  }
  document.getElementById('pc-'+id).classList.toggle('open');
}

    <div class="dim-card">
      <h3>✦ ${d.dim}</h3>
      <ul>${d.items.map(i=>`<li>${escapeHtml(i)}</li>`).join("")}</ul>
    </div>`).join("") + `</div>`;
}

function renderCyclesOverview(){
  return `<div class="cycle-grid">` + CYCLES.map(c => `
    <div class="cycle-card" onclick="setView('${c.id}')">
      <div class="cc-name">${c.name}</div>
      <span class="cc-mission">${c.mission}</span>
      <div class="cc-desc">${escapeHtml(c.desc)}</div>
      <div class="cc-go">查看双轨详情 →</div>
    </div>`).join("") + `</div>`;
}

function renderDimensions(){
  return `<div class="dim-grid">` + DIMENSIONS.map(d => `
    <div class="dim-card">
      <h3>◆ ${d.name}</h3>
      <ul>${d.items.map(i=>`<li>${escapeHtml(i)}</li>`).join("")}</ul>
    </div>`).join("") + `</div>`;
}

function renderHabits(){
  const habits = getHabits();
  const today = habits[todayStr()] || {};
  let html = "";
  HABITS.forEach((cat, ci) => {
    html += `<div style="margin-bottom:12px;">
      <div class="track-title">${cat.name}</div>
      ${cat.items.map((it, ii) => {
        const hid = `h-${ci}-${ii}`;
        const on = !!today[hid];
        return `<div class="li">
          <button class="chk ${on?'on':''}" onclick="toggleHabit('${hid}', this)"></button>
          <div class="li-text">${escapeHtml(it)}</div>
        </div>`;
      }).join("")}
    </div>`;
  });
  return html;
}

function renderReviews(){
  const reviews = getReviews();
  return REVIEWS.map(r => {
    const items = reviews.filter(x=>x.type===r.id).slice().reverse();
    return `<div class="review-block">
      <h4>📝 ${r.name}</h4>
      <div class="rb-desc">${escapeHtml(r.desc)}</div>
      <textarea class="note" id="rv_${r.id}" placeholder="记录本次${r.name}…"></textarea>
      <div style="margin-top:8px;"><button class="btn btn-primary" onclick="saveReview('${r.id}')">保存${r.name}</button></div>
      <div class="rv-list">${items.length? items.map(it=>`<div class="rv-item"><button class="rv-del" onclick="delReview('${it.id}')">✕</button><div class="rv-date">${it.date}</div><div class="rv-text">${escapeHtml(it.text)}</div></div>`).join("") : `<div class="empty">暂无记录，写下第一条复盘 ✍️</div>`}</div>
    </div>`;
  }).join("");
}

/* —— 周期详情页 —— */
function renderCycle(id){
  const cyc = CYCLES.find(c=>c.id===id);
  const det = CYCLE_DETAIL[id];
  const goals = getGoals();
  const habits = getHabits();
  const today = habits[todayStr()] || {};

  /* 整体进度 */
  const gids = det.results.map((_,i)=>`${id}-r${i}`);
  const pcts = gids.map(g=> (goals[g] && goals[g].pct) ? goals[g].pct : 0);
  const overall = pcts.length ? Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length) : 0;

  const resultsHtml = det.results.map((t,i)=>{
    const gid = `${id}-r${i}`;
    const g = goals[gid] || {done:false, pct:0};
    return `<div class="goal ${g.done?'done':''}" id="goal_${gid}">
      <div class="goal-main">
        <button class="chk ${g.done?'on':''}" onclick="toggleGoal('${gid}')"></button>
        <div class="goal-text">${escapeHtml(t)}</div>
      </div>
      <div class="goal-prog">
        <input type="range" min="0" max="100" value="${g.pct}" onchange="setGoalPct('${gid}',this.value)" oninput="setGoalPct('${gid}',this.value)">
        <span class="pct">${g.pct}%</span>
      </div>
    </div>`;
  }).join("");

  const deepsHtml = det.deeps.map((t,i)=>{
    const hid = `${id}-d${i}`;
    const on = !!today[hid];
    return `<div class="li">
      <button class="chk ${on?'on':''}" onclick="toggleHabit('${hid}', this)"></button>
      <div class="li-text">${escapeHtml(t)}</div>
    </div>`;
  }).join("");

  return `
    <button class="topback" onclick="setView('home')">← 返回首页总览</button>
    <div class="vision-banner glass-card" style="margin-bottom:14px;">
      <div class="vb-tag">🌹 核心使命 · ${cyc.mission}</div>
      <div class="vb-text" style="font-size:14px;">${cyc.name}｜${cyc.mission}：${escapeHtml(cyc.desc)}</div>
    </div>
    <div class="glass-card panel" style="padding:14px 18px 14px 24px;">
      <div class="track-head"><div class="track-title">🎯 阶段总进度</div><div class="track-sub">${overall}%</div></div>
      <div class="bar-wrap"><span style="width:${overall}%"></span></div>
      <div class="bar-label">基于「结果目标」完成度自动计算</div>
    </div>
    ${panel("🎯 结果目标（可量化落地）", `${det.results.length} 项`, resultsHtml, false)}
    ${panel("🌱 深耕坚持事项（日常常态化执行）", `${det.deeps.length} 项 · 每日打卡`, deepsHtml, false)}
  `;
}

function panel(title, sub, body, collapsed){
  return `<section class="glass-card panel ${collapsed?'collapsed':''}">
    <div class="panel-h" onclick="toggleCollapse(this)">
      <div class="ph-main"><h2>${title}</h2></div>
      <div style="display:flex;align-items:center;gap:8px;">
        ${sub?`<span class="ph-sub">${sub}</span>`:""}
        <span class="chev">▾</span>
      </div>
    </div>
    <div class="panel-b">${body}</div>
  </section>`;
}
function toggleCollapse(el){ el.closest(".panel").classList.toggle("collapsed"); }

/* ===================== 交互 ===================== */
function toggleGoal(gid){
  const g = getGoals(); const cur = g[gid] || {done:false, pct:0};
  cur.done = !cur.done;
  if(cur.done && cur.pct<100) cur.pct = 100;
  if(!cur.done) cur.pct = 0;
  g[gid] = cur; storeSet("pgw_goals", g);
  const el = document.getElementById("goal_"+gid);
  if(el){ el.classList.toggle("done", cur.done); el.querySelector(".chk").classList.toggle("on", cur.done); el.querySelector(".pct").textContent = cur.pct+"%"; el.querySelector("input[type=range]").value = cur.pct; }
  refreshCycleProgress();
}
function setGoalPct(gid, val){
  val = parseInt(val,10)||0;
  const g = getGoals(); const cur = g[gid] || {done:false, pct:0};
  cur.pct = val; cur.done = val>=100;
  g[gid] = cur; storeSet("pgw_goals", g);
  const el = document.getElementById("goal_"+gid);
  if(el){ el.classList.toggle("done", cur.done); el.querySelector(".chk").classList.toggle("on", cur.done); el.querySelector(".pct").textContent = val+"%"; }
  refreshCycleProgress();
}
function refreshCycleProgress(){
  if(currentView==="home") return;
  const det = CYCLE_DETAIL[currentView]; if(!det) return;
  const g = getGoals();
  const pcts = det.results.map((_,i)=>{ const o=g[`${currentView}-r${i}`]; return o?o.pct:0; });
  const overall = pcts.length? Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length):0;
  const bar = document.querySelector(".bar-wrap > span");
  const lbl = document.querySelector(".bar-label");
  if(bar) bar.style.width = overall+"%";
  const sub = document.querySelector(".track-head .track-sub");
  if(sub) sub.textContent = overall+"%";
  if(lbl) lbl.textContent = "基于「结果目标」完成度自动计算";
}
function toggleHabit(hid, el){
  const h = getHabits(); const d = todayStr();
  if(!h[d]) h[d] = {};
  if(h[d][hid]) delete h[d][hid]; else h[d][hid] = true;
  storeSet("pgw_habits", h);
  if(el) el.classList.toggle("on", !!h[d][hid]);
}
function saveReview(type){
  const ta = document.getElementById("rv_"+type);
  const text = ta.value.trim();
  if(!text){ return; }
  const list = getReviews();
  list.push({ id:"rv"+Date.now(), type, date: todayStr(), text });
  storeSet("pgw_reviews", list);
  render();
}
function delReview(rid){
  let list = getReviews();
  list = list.filter(x=>x.id!==rid);
  storeSet("pgw_reviews", list);
  render();
}

/* ===================== 开屏 / 初始化 ===================== */
function enterApp(){
  document.getElementById("splash").classList.add("hidden");
  try{ sessionStorage.setItem("pgw_splash_seen","1"); }catch(e){}
}
function initTitle(){
  const t = storeGet(APP_TITLE_KEY, "个人成长全景工作台");
  const el = document.getElementById("appTitle");
  el.textContent = t;
  el.addEventListener("input", ()=>{ storeSet(APP_TITLE_KEY, el.textContent.trim()||"个人成长全景工作台"); });
  el.addEventListener("blur", ()=>{ if(!el.textContent.trim()){ el.textContent="个人成长全景工作台"; } });
}
function initDate(){
  const d = new Date();
  const wk = ["日","一","二","三","四","五","六"][d.getDay()];
  document.getElementById("ahDate").textContent = `${d.getMonth()+1}月${d.getDate()}日 周${wk}`;
}
function makePetals(){
  const box = document.getElementById("petals");
  if(!box) return;
  for(let i=0;i<10;i++){
    const p = document.createElement("div"); p.className="petal";
    p.style.left = (Math.random()*100)+"%";
    p.style.animationDelay = (Math.random()*14)+"s";
    p.style.animationDuration = (12+Math.random()*8)+"s";
    p.style.width = (8+Math.random()*8)+"px"; p.style.height = p.style.width;
    box.appendChild(p);
  }
}
function init(){
  initTitle(); initDate(); makePetals();
  renderNav(); render();
  let seen = false; try{ seen = sessionStorage.getItem("pgw_splash_seen")==="1"; }catch(e){}
  if(seen) document.getElementById("splash").classList.add("hidden");
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
}
init();
</script>
</body>
