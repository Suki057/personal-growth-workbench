<style>
  :root {
    /* 小王子视觉系统 · 深蓝星空 + 奶油纸 + 玫瑰/薰衣草/暖金 */
    --bg: #1c2350;
    --surface: rgba(250,244,236,0.96);
    --surface-2: rgba(244,230,222,0.82);
    --text: #34304a;
    --muted: #8a7d92;
    --text-on-dark: #f6ecd9;
    --border: rgba(52,48,74,0.10);
    --primary: #D68AA6;       /* 玫瑰粉 */
    --primary-hover: #E39DB8;
    --secondary: #f0e6ef;     /* 薰衣草浅 */
    --secondary-hover: #e8dae9;
    --danger: #CE6E72;
    --success: #8FB0CB;
    --warning: #DDB46A;       /* 暖金 */
    --gold: #E8C98A;
    --rose: #D68AA6;
    --lavender: #B89AD0;
    --radius: 18px;
    --radius-sm: 12px;
    --shadow: 0 10px 24px rgba(26,22,48,0.22);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  input, select, textarea { font-size: 16px; font-family: inherit; max-zoom: 100%; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: var(--text);
    background:
      linear-gradient(0deg, rgba(26,32,70,0.98) 0%, rgba(26,32,70,0.82) 70px, transparent 190px),
      radial-gradient(2px 2px at 12% 14%, rgba(246,231,176,0.9) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 28% 32%, rgba(255,255,255,0.85) 50%, transparent 51%),
      radial-gradient(2px 2px at 47% 12%, rgba(246,231,176,0.8) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 66% 26%, rgba(255,255,255,0.8) 50%, transparent 51%),
      radial-gradient(2px 2px at 82% 18%, rgba(246,231,176,0.85) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 38% 48%, rgba(255,255,255,0.7) 50%, transparent 51%),
      radial-gradient(1100px 680px at 86% -10%, rgba(246,231,176,0.16), transparent 60%),
      linear-gradient(180deg, #1a2046 0%, #2a2c54 26%, #564a73 50%, #9a6f90 70%, #d293a6 86%, #f4e3d2 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  /* 滚动容器 */
  .app-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 18px 10px;
    background: linear-gradient(180deg, rgba(26,32,70,0.92), rgba(26,32,70,0.55));
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(246,231,176,0.55);
  }
  .ah-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .ah-emoji { font-size: 20px; filter: drop-shadow(0 0 6px rgba(246,231,176,0.6)); }
  .ah-title {
    font-size: 17px; font-weight: 800; letter-spacing: -0.02em; color: var(--text-on-dark);
    outline: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62vw;
  }
  .ah-date { font-size: 12px; color: rgba(246,236,217,0.75); font-weight: 600; white-space: nowrap; }
  main {
    max-width: 720px; margin: 0 auto;
    padding: calc(72px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom));
  }
  /* 区块卡片 · 奶油纸 + 左色散条 */
  .panel {
    position: relative; background: linear-gradient(180deg, rgba(250,244,236,0.96), rgba(244,230,222,0.90));
    border: 1px solid rgba(255,255,255,0.70); border-radius: var(--radius);
    padding: 18px 18px 18px 22px; margin-bottom: 16px; overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 10px 24px rgba(26,22,48,0.10);
  }
  .panel::before { content:""; position:absolute; top:0; left:0; right:0; height:42%; background: linear-gradient(180deg, rgba(255,255,255,0.55), transparent); pointer-events:none; }
  .panel::after {
    content:""; position:absolute; top:10px; bottom:10px; left:0; width:2.5px; border-radius:2px;
    background: linear-gradient(180deg,#E8A6BE,#D68AA6,#B89AD0,#E6D2DE,#F3E3D6,#FBF3E8);
    box-shadow: 0 0 8px rgba(214,138,166,0.5);
  }
  .panel-h { display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; user-select:none; margin-bottom: 10px; }
  .panel-h .ph-main { display:flex; align-items:center; gap:9px; min-width:0; }
  .ph-chip { font-size: 13px; }
  .panel-h h2 { font-size: 17px; font-weight: 800; color: #5A3A42; letter-spacing: -0.01em; }
  .panel-h .ph-sub { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .chev { color: var(--muted); font-size: 13px; transition: transform .2s; flex: none; }
  .panel.collapsed .chev { transform: rotate(-90deg); }
  .panel.collapsed .panel-b { display: none; }
  .panel-b { position: relative; }
  /* 愿景横幅 */
  .vision-banner {
    position: relative; background: linear-gradient(135deg, rgba(26,32,70,0.92), rgba(84,74,115,0.92));
    color: var(--text-on-dark); border-radius: var(--radius); padding: 20px 20px 18px; margin-bottom: 16px;
    border: 1px solid rgba(246,231,176,0.45); box-shadow: 0 12px 30px rgba(26,22,48,0.35); overflow:hidden;
  }
  .vision-banner::after { content:""; position:absolute; top:-40px; right:-30px; width:160px; height:160px; border-radius:50%; background: radial-gradient(circle, rgba(246,231,176,0.22), transparent 70%); }
  .vision-banner .vb-tag { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:#F3D9A8; letter-spacing:.04em; margin-bottom:8px; }
  .vision-banner .vb-text { font-size: 14.5px; line-height: 1.75; font-weight: 500; }
  .vision-banner .vb-note { margin-top:10px; font-size:12px; color: rgba(246,236,217,0.7); }
  /* 列表项通用 */
  .li { display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--border); }
  .li:last-child { border-bottom:none; }
  .li .li-text { font-size: 14px; line-height:1.55; color: var(--text); flex:1; min-width:0; }
  .li .li-bold { font-weight: 700; }
  .dim-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  @media (max-width: 540px){ .dim-grid { grid-template-columns: 1fr; } }
  .dim-card { background: var(--surface-2); border:1px solid var(--border); border-radius: var(--radius-sm); padding:12px 13px; }
  .dim-card h3 { font-size: 13.5px; font-weight:800; color:#7A4A58; margin-bottom:7px; display:flex; align-items:center; gap:6px; }
  .dim-card ul { list-style:none; }
  .dim-card li { font-size:12.5px; line-height:1.5; color:var(--text); padding:3px 0 3px 12px; position:relative; }
  .dim-card li::before { content:"·"; position:absolute; left:2px; color: var(--primary); font-weight:800; }
  /* 周期概览卡片 */
  .cycle-grid { display:grid; grid-template-columns: 1fr 1fr; gap:11px; }
  @media (max-width: 540px){ .cycle-grid { grid-template-columns: 1fr; } }
  .cycle-card { position:relative; background: var(--surface-2); border:1px solid var(--border); border-radius: var(--radius-sm); padding:13px 14px; cursor:pointer; transition: transform .15s, box-shadow .2s; overflow:hidden; }
  .cycle-card:active { transform: scale(0.985); }
  .cycle-card .cc-name { font-size:14.5px; font-weight:800; color:#5A3A42; }
  .cycle-card .cc-mission { display:inline-block; margin-top:5px; font-size:11px; font-weight:700; color:#fff; background: linear-gradient(135deg,#D68AA6,#B89AD0); padding:2px 9px; border-radius:10px; }
  .cycle-card .cc-desc { margin-top:8px; font-size:12px; line-height:1.55; color:var(--muted); }
  .cycle-card .cc-go { margin-top:9px; font-size:12px; font-weight:700; color: var(--lavender); }
  /* 结果目标 / 深耕 行 */
  .goal { padding:11px 0; border-bottom:1px solid var(--border); }
  .goal:last-child { border-bottom:none; }
  .goal-main { display:flex; gap:10px; align-items:flex-start; }
  .goal-text { font-size:14px; line-height:1.55; flex:1; min-width:0; }
  .goal.done .goal-text { text-decoration: line-through; color: var(--muted); }
  .goal-prog { display:flex; align-items:center; gap:10px; margin:8px 0 0 30px; }
  .goal-prog input[type=range]{ flex:1; accent-color: var(--primary); height:4px; }
  .pct { font-size:12px; font-weight:700; color: var(--primary); min-width:38px; text-align:right; }
  .chk { width:22px; height:22px; flex:none; border-radius:7px; border:2px solid var(--primary); background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; transition: background .15s; margin-top:1px; }
  .chk.on { background: var(--primary); }
  .chk.on::after { content:"✓"; }
  .streak { font-size:11px; color: var(--warning); font-weight:700; white-space:nowrap; }
  .track-head { display:flex; align-items:center; justify-content:space-between; margin:6px 0 4px; }
  .track-title { font-size:13px; font-weight:800; color:#7A4A58; }
  .track-sub { font-size:11px; color:var(--muted); }
  .bar-wrap { height:8px; border-radius:6px; background: rgba(52,48,74,0.10); overflow:hidden; margin:6px 0 2px; }
  .bar-wrap > span { display:block; height:100%; background: linear-gradient(90deg,#D68AA6,#B89AD0); border-radius:6px; transition: width .3s; }
  .bar-label { font-size:11px; color: var(--muted); font-weight:600; }
  /* 复盘 */
  .review-block { border-top:1px dashed var(--border); padding-top:12px; margin-top:12px; }
  .review-block:first-child { border-top:none; padding-top:0; margin-top:0; }
  .review-block h4 { font-size:14px; font-weight:800; color:#5A3A42; margin-bottom:3px; }
  .review-block .rb-desc { font-size:12px; color:var(--muted); line-height:1.5; margin-bottom:9px; }
  textarea.note { width:100%; border:none; border-radius:12px; padding:11px 13px; font-size:14px; color:var(--text); background: var(--surface-2); outline:none; resize:vertical; min-height:64px; box-shadow: inset 0 1px 3px rgba(52,48,74,0.10); }
  textarea.note:focus { box-shadow: inset 0 1px 3px rgba(52,48,74,0.10), 0 0 0 2px rgba(214,138,166,0.35); }
  .btn { border:none; border-radius:11px; padding:10px 16px; font-size:13.5px; font-weight:700; cursor:pointer; transition: transform .12s, box-shadow .2s; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { color:#fff; background: linear-gradient(135deg,#D68AA6,#B89AD0); box-shadow: 0 6px 16px rgba(184,154,208,0.4); }
  .btn-gold { color:#5a3d1f; background: linear-gradient(180deg,#ffe7b3,#f5c977); box-shadow: 0 6px 16px rgba(245,201,119,0.4); }
  .btn-ghost { color: var(--text); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border); }
  .rv-list { margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .rv-item { background: var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:9px 11px; position:relative; }
  .rv-item .rv-date { font-size:11px; color:var(--muted); font-weight:700; margin-bottom:3px; }
  .rv-item .rv-text { font-size:13px; line-height:1.55; color:var(--text); white-space:pre-wrap; word-break:break-word; }
  .rv-del { position:absolute; top:7px; right:8px; border:none; background:transparent; color:var(--danger); font-size:13px; cursor:pointer; }
  .empty { font-size:12.5px; color:var(--muted); padding:8px 2px; }
  /* 底部导航 */
  .bottom-nav {
    position: fixed; left:0; right:0; bottom:0; z-index:50;
    display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, rgba(26,32,70,0.96), rgba(26,32,70,0.80));
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-top: 1px solid rgba(246,231,176,0.55);
  }
  .bottom-nav::-webkit-scrollbar { display:none; }
  .nav-tab { flex:none; border:none; background:transparent; color: rgba(246,236,217,0.65); font-size:13px; font-weight:700; padding:8px 14px; border-radius:12px; cursor:pointer; white-space:nowrap; transition: background .15s, color .15s; }
  .nav-tab.active { color:#5a3d1f; background: linear-gradient(180deg,#ffe7b3,#f5c977); box-shadow: 0 4px 12px rgba(245,201,119,0.35); }
  /* 开屏 */
  .splash { position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px; text-align:center;
    background: linear-gradient(180deg, #141a3e 0%, #2a2c54 26%, #564a73 50%, #9a6f90 70%, #d293a6 86%, #f4e3d2 100%); }
  .splash.hidden { display:none; }
  .splash svg { width: 200px; height: 200px; margin-bottom: 14px; filter: drop-shadow(0 8px 20px rgba(26,22,48,0.4)); }
  .splash h1 { color:#fff; font-size:24px; font-weight:800; letter-spacing:-0.02em; text-shadow: 0 2px 10px rgba(26,22,48,0.5); }
  .splash .sp-sub { color: rgba(246,236,217,0.92); font-size:13px; margin-top:8px; font-weight:600; }
  .splash .sp-quote { color: rgba(246,236,217,0.82); font-size:12.5px; margin-top:16px; line-height:1.7; max-width:300px; font-style:italic; }
  .splash .sp-enter { margin-top:22px; border:none; border-radius:999px; padding:13px 34px; font-size:15px; font-weight:800; color:#5a3d1f; background: linear-gradient(180deg,#ffe7b3,#f5c977); box-shadow: 0 8px 22px rgba(245,201,119,0.5); cursor:pointer; }
  .sp-stars { position:absolute; inset:0; pointer-events:none; }
  .quote-deco { text-align:center; color: var(--lavender); font-size:12px; font-style:italic; margin: 2px 0 14px; opacity:.85; }
  .topback { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color: var(--lavender); background: var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:6px 12px; cursor:pointer; margin-bottom:12px; }
</style>
</head>

/* ===================== 存储 ===================== */
function storeGet(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function storeSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* 三套打卡数据 */
function getGoals(){ return storeGet("pgw_goals", {}); }   /* gid -> {done, pct} */
function getHabits(){ return storeGet("pgw_habits", {}); } /* date -> {hid:true} */
function getReviews(){ return storeGet("pgw_reviews", []); } /* [{id,type,date,text}] */

/* ===================== 状态 / 渲染 ===================== */
let currentView = "home";

const NAV = [
  { id:"home", label:"首页" },
  { id:"2026", label:"2026" },
  { id:"1y", label:"1年" },
  { id:"3y", label:"3年" },
  { id:"5y", label:"5年" },
];

function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = NAV.map(t => `<button class="nav-tab ${currentView===t.id?'active':''}" onclick="setView('${t.id}')">${t.label}</button>`).join("");
}
function setView(v){ currentView = v; renderNav(); render(); window.scrollTo(0,0); }

function render(){
  const c = document.getElementById("container");
  if(currentView === "home") c.innerHTML = renderHome();
  else c.innerHTML = renderCycle(currentView);
}

/* —— 首页 —— */
function renderHome(){
  return `
    ${visionBanner()}
    ${panel("🌟 人生北极星 · 5年终极愿景", "所有目标服务于这一条愿景", renderNorthStar(), true)}
    ${panel("🗓 四大时间周期总览", "层层递进 · 闭环迭代", renderCyclesOverview(), true)}
    ${panel("🧭 五大固定成长维度", "终身固定 · 全赛道归类", renderDimensions(), true)}
    ${panel("🌱 每日深耕复利习惯库", "长期复利 · 每日/每周固定执行", renderHabits(), true)}
    ${panel("🔄 复盘迭代体系", "周 / 月 / 年 三级校准", renderReviews(), true)}
  `;
}

function visionBanner(){
  return `<div class="vision-banner">
    <div class="vb-tag">🌹 置顶核心人生愿景 · 永久固定</div>
    <div class="vb-text">${escapeHtml(VISION)}</div>
    <div class="vb-note">所有目标、所有行动，全部服务于这一条愿景。</div>
  </div>`;
}

function panel(title, sub, body, collapsed){
  return `<section class="panel ${collapsed?'collapsed':''}">
    <div class="panel-h" onclick="toggleCollapse(this)">
      <div class="ph-main"><h2>${title}</h2></div>
      <div style="display:flex;align-items:center;gap:8px;">
        ${sub?`<span class="ph-sub">${sub}</span>`:""}
        <span class="chev">▾</span>
      </div>
    </div>
    <div class="panel-b">${body}</div>
  </section>`;
}
function toggleCollapse(el){ el.closest(".panel").classList.toggle("collapsed"); }

function renderNorthStar(){
  return `<div class="dim-grid">` + NORTH_STAR.map(d => `
    <div class="dim-card">
      <h3>✦ ${d.dim}</h3>
      <ul>${d.items.map(i=>`<li>${escapeHtml(i)}</li>`).join("")}</ul>
    </div>`).join("") + `</div>`;
}

function renderCyclesOverview(){
  return `<div class="cycle-grid">` + CYCLES.map(c => `
    <div class="cycle-card" onclick="setView('${c.id}')">
      <div class="cc-name">${c.name}</div>
      <span class="cc-mission">${c.mission}</span>
      <div class="cc-desc">${escapeHtml(c.desc)}</div>

}

function renderDimensions(){
  return `<div class="dim-grid">` + DIMENSIONS.map(d => `
    <div class="dim-card">
      <h3>◆ ${d.name}</h3>
      <ul>${d.items.map(i=>`<li>${escapeHtml(i)}</li>`).join("")}</ul>
    </div>`).join("") + `</div>`;
}

function renderHabits(){
  const habits = getHabits();
  const today = habits[todayStr()] || {};
  let html = "";
  HABITS.forEach((cat, ci) => {
    html += `<div style="margin-bottom:12px;">
      <div class="track-title">${cat.name}</div>
      ${cat.items.map((it, ii) => {
        const hid = `h-${ci}-${ii}`;
        const on = !!today[hid];
        return `<div class="li">
          <button class="chk ${on?'on':''}" onclick="toggleHabit('${hid}', this)"></button>
          <div class="li-text">${escapeHtml(it)}</div>
        </div>`;
      }).join("")}
    </div>`;
  });
  return html;
}

function renderReviews(){
  const reviews = getReviews();
  return REVIEWS.map(r => {
    const items = reviews.filter(x=>x.type===r.id).slice().reverse();
    return `<div class="review-block">
      <h4>📝 ${r.name}</h4>
      <div class="rb-desc">${escapeHtml(r.desc)}</div>
      <textarea class="note" id="rv_${r.id}" placeholder="记录本次${r.name}…"></textarea>
      <div style="margin-top:8px;"><button class="btn btn-primary" onclick="saveReview('${r.id}')">保存${r.name}</button></div>
      <div class="rv-list">${items.length? items.map(it=>`<div class="rv-item"><button class="rv-del" onclick="delReview('${it.id}')">✕</button><div class="rv-date">${it.date}</div><div class="rv-text">${escapeHtml(it.text)}</div></div>`).join("") : `<div class="empty">暂无记录，写下第一条复盘 ✍️</div>`}</div>
    </div>`;
  }).join("");
}

/* —— 周期详情页 —— */
function renderCycle(id){
  const cyc = CYCLES.find(c=>c.id===id);
  const det = CYCLE_DETAIL[id];
  const goals = getGoals();
  const habits = getHabits();
  const today = habits[todayStr()] || {};

  /* 整体进度 */
  const gids = det.results.map((_,i)=>`${id}-r${i}`);
  const pcts = gids.map(g=> (goals[g] && goals[g].pct) ? goals[g].pct : 0);
  const overall = pcts.length ? Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length) : 0;

  const resultsHtml = det.results.map((t,i)=>{
    const gid = `${id}-r${i}`;
    const g = goals[gid] || {done:false, pct:0};
    return `<div class="goal ${g.done?'done':''}" id="goal_${gid}">
      <div class="goal-main">
        <button class="chk ${g.done?'on':''}" onclick="toggleGoal('${gid}')"></button>
        <div class="goal-text">${escapeHtml(t)}</div>
      </div>
      <div class="goal-prog">
        <input type="range" min="0" max="100" value="${g.pct}" onchange="setGoalPct('${gid}',this.value)" oninput="setGoalPct('${gid}',this.value)">
        <span class="pct">${g.pct}%</span>
      </div>
    </div>`;
  }).join("");

  const deepsHtml = det.deeps.map((t,i)=>{
    const hid = `${id}-d${i}`;
    const on = !!today[hid];
    return `<div class="li">
      <button class="chk ${on?'on':''}" onclick="toggleHabit('${hid}', this)"></button>
      <div class="li-text">${escapeHtml(t)}</div>
    </div>`;
  }).join("");

  return `
    <button class="topback" onclick="setView('home')">← 返回首页总览</button>
    <div class="vision-banner" style="margin-bottom:14px;">
      <div class="vb-tag">🌹 核心使命 · ${cyc.mission}</div>
      <div class="vb-text" style="font-size:14px;">${cyc.name}｜${cyc.mission}：${escapeHtml(cyc.desc)}</div>
    </div>
    <div class="panel">
      <div class="track-head"><div class="track-title">🎯 阶段总进度</div><div class="track-sub">${overall}%</div></div>
      <div class="bar-wrap"><span style="width:${overall}%"></span></div>
      <div class="bar-label">基于「结果目标」完成度自动计算</div>
    </div>
    ${panel("🎯 结果目标（可量化落地）", `${det.results.length} 项`, resultsHtml, false)}
    ${panel("🌱 深耕坚持事项（日常常态化执行）", `${det.deeps.length} 项 · 每日打卡`, deepsHtml, false)}
  `;
}

/* ===================== 交互 ===================== */
function toggleGoal(gid){
  const g = getGoals(); const cur = g[gid] || {done:false, pct:0};
  cur.done = !cur.done;
  if(cur.done && cur.pct<100) cur.pct = 100;
  if(!cur.done) cur.pct = 0;
  g[gid] = cur; storeSet("pgw_goals", g);
  const el = document.getElementById("goal_"+gid);
  if(el){ el.classList.toggle("done", cur.done); el.querySelector(".chk").classList.toggle("on", cur.done); el.querySelector(".pct").textContent = cur.pct+"%"; el.querySelector("input[type=range]").value = cur.pct; }
  refreshCycleProgress();
}
function setGoalPct(gid, val){
  val = parseInt(val,10)||0;
  const g = getGoals(); const cur = g[gid] || {done:false, pct:0};
  cur.pct = val; cur.done = val>=100;
  g[gid] = cur; storeSet("pgw_goals", g);
  const el = document.getElementById("goal_"+gid);
  if(el){ el.classList.toggle("done", cur.done); el.querySelector(".chk").classList.toggle("on", cur.done); el.querySelector(".pct").textContent = val+"%"; }
  refreshCycleProgress();
}
function refreshCycleProgress(){
  if(currentView==="home") return;
  const det = CYCLE_DETAIL[currentView]; if(!det) return;
  const g = getGoals();
  const pcts = det.results.map((_,i)=>{ const o=g[`${currentView}-r${i}`]; return o?o.pct:0; });
  const overall = pcts.length? Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length):0;
  const bar = document.querySelector(".bar-wrap > span");
  const lbl = document.querySelector(".bar-label");
  if(bar) bar.style.width = overall+"%";
  const sub = document.querySelector(".track-head .track-sub");
  if(sub) sub.textContent = overall+"%";
  if(lbl) lbl.textContent = "基于「结果目标」完成度自动计算";
}
function toggleHabit(hid, el){
  const h = getHabits(); const d = todayStr();
  if(!h[d]) h[d] = {};
  if(h[d][hid]) delete h[d][hid]; else h[d][hid] = true;
  storeSet("pgw_habits", h);
  if(el) el.classList.toggle("on", !!h[d][hid]);
}
function saveReview(type){
  const ta = document.getElementById("rv_"+type);
  const text = ta.value.trim();
  if(!text){ return; }
  const list = getReviews();
  list.push({ id:"rv"+Date.now(), type, date: todayStr(), text });
  storeSet("pgw_reviews", list);
  render();
}
function delReview(rid){
  let list = getReviews();
  list = list.filter(x=>x.id!==rid);
  storeSet("pgw_reviews", list);
  render();
}

  document.getElementById("splash").classList.add("hidden");

}

  const t = storeGet(APP_TITLE_KEY, "个人成长全景工作台");

  const d = new Date();

function init(){
  initTitle(); initDate();

  let seen = false; try{ seen = sessionStorage.getItem("pgw_splash_seen")==="1"; }catch(e){}
  if(seen) document.getElementById("splash").classList.add("hidden");
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
}
init();
